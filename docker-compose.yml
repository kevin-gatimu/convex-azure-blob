# Local Azure Blob Storage emulator for the example app and the integration tests.
#   docker compose up -d azurite && npm run azurite:setup
services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:${AZURITE_TAG:-3.35.0}
    command:
      azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --loose
      --skipApiVersionCheck
    ports:
      - "127.0.0.1:${AZURITE_BLOB_PORT:-10000}:10000"
