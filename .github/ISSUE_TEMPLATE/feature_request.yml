name: Feature request
description: Suggest an idea or a new capability.
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an idea. The most useful requests describe the problem and the use case,
        not only the proposed API. See our [contributing guide](https://github.com/kevin-gatimu/convex-azure-blob/blob/main/CONTRIBUTING.md)
        if you would like to help implement it.

        Do not include credentials, connection strings, SAS tokens or URLs, or other secrets.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description:
        What are you trying to do with convex-azure-blob, and what gets in the
        way today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description:
        What would you like to see? A sketch of the TypeScript API or expected
        behavior is welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description:
        Any workarounds or other approaches you tried or thought about.
    validations:
      required: false

  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description:
        How would this be used in practice? Concrete examples help a lot.
    validations:
      required: false

  - type: textarea
    id: prior-art
    attributes:
      label: Prior art
      description:
        Links to other projects, issues, or documentation that solve something
        similar.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
