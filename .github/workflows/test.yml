name: Test and lint
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

jobs:
  check:
    name: Test and lint (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ["22.x", "24.x"]
    services:
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:3.35.0
        ports:
          - 10000:10000
    env:
      AZURITE_BLOB_ENDPOINT: http://127.0.0.1:10000/devstoreaccount1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Node setup
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          cache-dependency-path: package-lock.json
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Install and build
        run: |
          npm ci
          npm run build
      - name: Publish package for testing branch
        if: matrix.node == '24.x'
        run: npx pkg-pr-new publish || echo "pkg-pr-new failed"
      - name: Prepare Azurite
        run: npm run azurite:setup
      - name: Test
        run: |
          npm run test
          npm run typecheck
          npm run lint
      - name: Coverage
        if: matrix.node == '24.x'
        run: npm run test:coverage
      - name: Lint packed package
        if: matrix.node == '24.x'
        run: npm run lint:package
      - name: Test packed package
        # Checks the minimum peers, not Node; npm 10 on Node 22 crashes on the aliased typescript dev dependency.
        if: matrix.node == '24.x'
        run: npm run test:package

  windows:
    name: Test and lint (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Node setup
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          cache-dependency-path: package-lock.json
          node-version: "24.x"
          cache: "npm"

      # Separate steps: PowerShell does not stop a multi-line script on a failing native command.
      # No Azurite service container on Windows; those tests skip without AZURITE_BLOB_ENDPOINT.
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
